[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atap"
version = "0.1.0"
description = "Agent Trajectory Analysis Platform — pluggable pipeline for trajectory representation, analysis, error classification, failure attribution and recovery"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "pydantic>=2.0"]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
atap = "atap.cli:main"

# src/ is the atap package (package-dir mapping, no src/atap nesting); subpackages
# are listed explicitly — root-level content (tests/configs/docs/runs) is excluded
# from the distribution
[tool.setuptools]
package-dir = {"atap" = "src"}
packages = [
    "atap",
    "atap.core",
    "atap.llm",
    "atap.io",
    "atap.sandbox",
    "atap.represent",
    "atap.analyze",
    "atap.classify",
    "atap.attribute",
    "atap.recover",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
