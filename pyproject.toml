[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atap"
version = "0.1.0"
description = "Agent Trace Analysis Platform — pluggable pipeline for trace representation, analysis, error classification, failure attribution and recovery"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "aaronlyt" }]
readme = "docs/pypi_readme.md"
keywords = [
    "llm",
    "agents",
    "traces",
    "failure-attribution",
    "root-cause-analysis",
    "observability",
    "langfuse",
    "evaluation",
    "debugging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0", "pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/aaronlyt/agent-trace-analysis-platform"
Repository = "https://github.com/aaronlyt/agent-trace-analysis-platform"
Issues = "https://github.com/aaronlyt/agent-trace-analysis-platform/issues"

[project.optional-dependencies]
llm = ["openai>=1.0"]
langfuse = ["httpx>=0.27"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
atap = "atap.cli:main"

# src/ is the atap package (package-dir mapping, no src/atap nesting); subpackages
# are listed explicitly — root-level content (tests/configs/docs/runs) is excluded
# from the distribution
[tool.setuptools]
package-dir = {"atap" = "src"}
packages = [
    "atap",
    "atap.core",
    "atap.llm",
    "atap.io",
    "atap.sandbox",
    "atap.represent",
    "atap.analyze",
    "atap.classify",
    "atap.attribute",
    "atap.recover",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# make the repo root importable regardless of invocation style: tests import
# helpers via both `from helpers import ...` and `from tests.helpers import ...`
# (the latter requires the root on sys.path -- previously only
# `python -m pytest` from the repo root provided it; bare `pytest` failed
# collection with ModuleNotFoundError: No module named 'tests')
pythonpath = ["."]
