# Offline full-chain configuration (FakeLLM deterministic judge + toy sandbox, zero-network reproducible)
run_name: offline-full-pipeline
seed: 7

source:
  type: jsonl
  path: runs/demo/traces.jsonl     # Generate first via `atap demo`, or write your own with atap.sandbox

llm:
  type: fake                        # Deterministic pseudo-judge (rule-based symptom detection, no ground truth used)

sandbox:
  type: toy                         # ReplayEnvironment: the execution side of targeted rerun

closed_loop: true                   # recover outputs automatically flow back to analyze to verify improvement (step 6 → 3)

stages:
  represent:
    - canonical_events              # R0: span tree flattened into a unified event stream
    - ssf                           # R1: saliency folding (TrajAudit 2605.26563)
  analyze:
    - judge_eval                    # LLM-as-judge evaluation (MAST judge-pipeline style)
  classify:
    - mast_judge                    # MAST 14-failure-mode labeling (2503.13657)
  attribute:
    - all_at_once                   # L1 single-pass attribution (Who&When 2505.00212)
  recover:
    - name: targeted_rerun          # Targeted rerun (AgentDebug 2509.25370)
      params:
        max_rounds: 5
