# 真实 LLM 配置（OpenAI 兼容接口，示例为 OpenRouter）
# 需要环境变量：OPENAI_API_KEY（必需）、OPENAI_BASE_URL（OpenRouter: https://openrouter.ai/api/v1）
# 依赖：pip install 'atap[llm]'
run_name: llm-full-pipeline
seed: 7

source:
  type: jsonl
  path: runs/demo/traces.jsonl

llm:
  type: openai
  model: stealth/ox-alpha          # OpenRouter 模型名
  temperature: 0.0                  # 判官类任务取 0 保证可复现

sandbox:
  type: toy

closed_loop: true

stages:
  represent:
    - canonical_events
    - ssf
  analyze:
    - name: judge_eval
      params:
        only_failures: false      # 成功轨迹也评测（分数基线）
  classify:
    - mast_judge
  attribute:
    - all_at_once
  recover:
    - name: targeted_rerun
      params:
        max_rounds: 5
