# Real LLM configuration (OpenAI-compatible API, example uses OpenRouter)
# Requires environment variables: OPENAI_API_KEY (required), OPENAI_BASE_URL (OpenRouter: https://openrouter.ai/api/v1)
# Dependency: pip install 'atap[llm]'
run_name: llm-full-pipeline
seed: 7

source:
  type: jsonl
  path: runs/demo/traces.jsonl

llm:
  type: openai
  model: stealth/ox-alpha          # OpenRouter model name
  temperature: 0.0                  # 0 for judge-style tasks to guarantee reproducibility

sandbox:
  type: toy

closed_loop: true

stages:
  represent:
    - canonical_events
    - ssf
  analyze:
    - name: judge_eval
      params:
        only_failures: false      # Successful trajectories are also evaluated (score baseline)
  classify:
    - mast_judge
  attribute:
    - all_at_once
  recover:
    - name: targeted_rerun
      params:
        max_rounds: 5
