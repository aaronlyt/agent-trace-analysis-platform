# Real LLM claim ledger audit (stealth/ox-alpha,
# ~18 calls on the demo corpus: ledger 7 + claim_audit 11 -- the second tier after the 26-call smoke test)
run_name: realtest-ox-claim
seed: 7

source:
  type: jsonl
  path: runs/demo/traces.jsonl

llm:
  type: openai
  model: "stealth/ox-alpha"
  temperature: 0.0
  request_interval: 3.0
  # claim_audit_support carries a long rationale per claim and 4096 truncates the JSON (observed on the first run:
  # still truncated after 2 repair retries, then failed explicitly); 8192 is needed to hold the full records array
  max_completion_tokens: 8192

stages:
  represent:
    - canonical_events
    - ssf
    - claim_ledger              # Claim 6-tuple extraction (1 call per trajectory)
  attribute:
    - claim_audit               # Support/trace audit + first erroneous commitment step
