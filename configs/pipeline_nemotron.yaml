# Real LLM configuration (OpenRouter free tier: nvidia/nemotron-3.5-lightning:free)
# Requires environment variables: OPENAI_API_KEY (OpenRouter sk-or-v1-...) and
#               OPENAI_BASE_URL=https://openrouter.ai/api/v1
# Dependency: pip install 'atap[llm]'
run_name: nemotron-full-pipeline
seed: 7

source:
  type: jsonl
  path: runs/demo/traces.jsonl

llm:
  type: openai
  model: "nvidia/nemotron-3.5-lightning:free"   # OpenRouter free-tier model
  temperature: 0.0                               # 0 for judge-style tasks to guarantee reproducibility
  request_interval: 3.0                          # Free-tier rate limits are tighter, so a larger throttling interval

sandbox:
  type: toy

closed_loop: true

stages:
  represent:
    - canonical_events
    - ssf
  analyze:
    - name: judge_eval
      params:
        only_failures: false      # Successful trajectories are also evaluated (score baseline)
  classify:
    - mast_judge
  attribute:
    - all_at_once
  recover:
    - name: targeted_rerun
      params:
        max_rounds: 5
